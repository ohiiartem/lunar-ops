services:
  - type: web
    name: lunar-ops
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && npm --prefix visualization ci && npm --prefix visualization run build
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port "$PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: NODE_VERSION
        value: "22"
